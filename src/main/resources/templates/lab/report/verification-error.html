<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RR Diagnostics - Verification</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body text-center p-5">

            <h2 class="text-danger">
                Report Not Found
            </h2>

            <p class="mt-3">

                No laboratory report was found for:

            </p>

            <h4
                    th:text="${billNumber}">
                RR-000000
            </h4>

            <div
                    class="alert alert-warning mt-4"
                    th:text="${error}">
                Report not found.
            </div>

            <a
                    href="/"
                    class="btn btn-primary">

                Go Home

            </a>

        </div>

    </div>

</div>

</body>

</html>
