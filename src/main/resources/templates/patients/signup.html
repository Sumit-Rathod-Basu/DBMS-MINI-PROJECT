<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Signup</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .signup-container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .note {
            margin-top: 20px;
            padding: 12px;
            background: #eff6ff;
            border-radius: 7px;
            color: #1e40af;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="signup-container">

    <h1>Patient Signup</h1>

    <p class="subtitle">
        Create your laboratory account
    </p>

    <!-- Error Message -->
    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/patients/signup}" method="post">

        <label for="email">Registered Email</label>

        <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required
        >

        <label for="password">Password</label>

        <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
        >

        <label for="confirmPassword">Confirm Password</label>

        <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Re-enter password"
                required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="note">
        Your email must already be registered by the laboratory assistant.
    </div>

    <div class="login-link">
        Already have an account?
        <a th:href="@{/patients/login}">
            Login
        </a>
    </div>

</div>

</body>
</html>
