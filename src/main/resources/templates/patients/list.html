<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Patients</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            color: #333;
        }

        .top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .add {
            background: #198754;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        input {
            padding: 10px;
            width: 250px;
        }

        button {
            padding: 10px 15px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #343a40;
            color: white;
        }

        .action {
            text-decoration: none;
            margin-right: 8px;
        }

        .delete {
            color: red;
            border: none;
            background: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top">

        <h1>Patient Management</h1>

        <a href="/patients/new" class="add">
            + Add Patient
        </a>

    </div>

    <!-- Search -->
    <form action="/patients/search" method="get">

        <input type="text"
               name="name"
               placeholder="Search by first name"
               required>

        <button type="submit">
            Search
        </button>

        <a href="/patients">
            Show All
        </a>

    </form>

    <br>

    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Gender</th>
            <th>DOB</th>
            <th>Mobile</th>
            <th>Blood Group</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="p : ${patients}">

            <td th:text="${p.patientId}"></td>

            <td>
                <span th:text="${p.firstName}"></span>
                <span th:text="${p.lastName}"></span>
            </td>

            <td th:text="${p.gender}"></td>

            <td th:text="${p.dateOfBirth}"></td>

            <td th:text="${p.mobile}"></td>

            <td th:text="${p.bloodGroup}"></td>

            <td th:text="${p.status}"></td>

            <td>

                <a class="action"
                   th:href="@{/patients/{id}(id=${p.patientId})}">
                    View
                </a>

                <a class="action"
                   th:href="@{/patients/{id}/edit(id=${p.patientId})}">
                    Edit
                </a>

                <form th:action="@{/patients/{id}/delete(id=${p.patientId})}"
                      method="post"
                      style="display:inline">

                    <button class="delete"
                            type="submit"
                            onclick="return confirm('Deactivate this patient?')">
                        Delete
                    </button>

                </form>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(patients)}">

            <td colspan="8">
                No patients found.
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
