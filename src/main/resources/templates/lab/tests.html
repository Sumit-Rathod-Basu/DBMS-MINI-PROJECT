<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Lab Tests</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            max-width: 1250px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
        }

        .add-btn {
            background: #1976d2;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 5px;
        }

        .add-btn:hover {
            background: #125ca5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 11px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1976d2;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f8f8;
        }

        .status {
            padding: 5px 10px;
            border-radius: 15px;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 13px;
        }

        .delete-btn {
            background: #d32f2f;
            color: white;
            padding: 7px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background: #a52222;
        }

        .empty {
            text-align: center;
            padding: 25px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Lab Test Management</h1>

        <a href="/lab/tests/add" class="add-btn">
            + Add Test
        </a>

    </div>


    <table>

        <thead>

        <tr>

            <th>ID</th>

            <th>Test Code</th>

            <th>Test Name</th>

            <th>Category</th>

            <th>Sample Type</th>

            <th>Price</th>

            <th>Normal Range</th>

            <th>Unit</th>

            <th>Status</th>

            <th>Created At</th>

            <th>Action</th>

        </tr>

        </thead>


        <tbody>

        <tr th:if="${#lists.isEmpty(tests)}">

            <td colspan="11" class="empty">
                No lab tests found.
            </td>

        </tr>


        <tr th:each="test : ${tests}">

            <td th:text="${test.testId}">
                1
            </td>

            <td th:text="${test.testCode}">
                CBC001
            </td>

            <td th:text="${test.testName}">
                Complete Blood Count
            </td>

            <td th:text="${test.category}">
                Hematology
            </td>

            <td th:text="${test.sampleType}">
                Blood
            </td>

            <td th:text="${test.price}">
                350.00
            </td>

            <td th:text="${test.normalRange}">
                4.5 - 11
            </td>

            <td th:text="${test.unit}">
                x10^9/L
            </td>

            <td>

                <span class="status"
                      th:text="${test.status}">
                    ACTIVE
                </span>

            </td>

            <td th:text="${test.createdAt}">
                2026-10-07
            </td>

            <td>

                <a class="delete-btn"
                   th:href="@{/lab/tests/delete/{id}(id=${test.testId})}"
                   onclick="return confirm('Are you sure you want to delete this test?');">

                    Delete

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
