<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Lab Assistants</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
        }

        .add-btn {
            background: #1976d2;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 5px;
        }

        .add-btn:hover {
            background: #125ca5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1976d2;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f8f8;
        }

        .status {
            padding: 5px 9px;
            border-radius: 15px;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 13px;
        }

        .delete-btn {
            background: #d32f2f;
            color: white;
            padding: 7px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background: #a52222;
        }

        .empty {
            text-align: center;
            padding: 25px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Lab Assistant Management</h1>

        <a href="/lab/assistants/add" class="add-btn">
            + Add Assistant
        </a>

    </div>


    <table>

        <thead>

        <tr>

            <th>ID</th>

            <th>Full Name</th>

            <th>Email</th>

            <th>Mobile</th>

            <th>Status</th>

            <th>Created At</th>

            <th>Action</th>

        </tr>

        </thead>


        <tbody>

        <tr th:if="${#lists.isEmpty(assistants)}">

            <td colspan="7" class="empty">
                No lab assistants found.
            </td>

        </tr>


        <tr th:each="assistant : ${assistants}">

            <td th:text="${assistant.assistantId}">
                1
            </td>

            <td th:text="${assistant.fullName}">
                Sumit Rathod
            </td>

            <td th:text="${assistant.email}">
                assistant@pathology.com
            </td>

            <td th:text="${assistant.mobile}">
                9876543210
            </td>

            <td>

                <span class="status"
                      th:text="${assistant.status}">
                    ACTIVE
                </span>

            </td>

            <td th:text="${assistant.createdAt}">
                2026-10-07
            </td>

            <td>

                <a class="delete-btn"
                   th:href="@{/lab/assistants/delete/{id}(id=${assistant.assistantId})}"
                   onclick="return confirm('Are you sure you want to delete this assistant?');">

                    Delete

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
