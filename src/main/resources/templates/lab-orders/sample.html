<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Lab Samples</title>
</head>

<body>

<h1>Lab Samples</h1>

<table border="1">

    <thead>
        <tr>
            <th>ID</th>
            <th>Sample Code</th>
            <th>Sample Type</th>
            <th>Collection Time</th>
            <th>Received Time</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody>

        <tr th:each="sample : ${samples}">

            <td th:text="${sample.sampleId}"></td>

            <td th:text="${sample.sampleCode}"></td>

            <td th:text="${sample.sampleType}"></td>

            <td th:text="${sample.collectionTime}"></td>

            <td th:text="${sample.receivedTime}"></td>

            <td th:text="${sample.status}"></td>

        </tr>

    </tbody>

</table>

</body>
</html>
