<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Add Lab Test</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .form-container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1976d2;
        }

        .buttons {
            margin-top: 25px;
        }

        button {
            padding: 11px 20px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #125ca5;
        }

        .back {
            margin-left: 12px;
            text-decoration: none;
            color: #555;
        }

    </style>

</head>

<body>

<div class="form-container">

    <h1>Add Lab Test</h1>

    <form th:action="@{/lab/tests/save}"
          th:object="${test}"
          method="post">


        <!-- Test Code -->
        <label>Test Code</label>

        <input type="text"
               th:field="*{testCode}"
               placeholder="Example: CBC001"
               required>


        <!-- Test Name -->
        <label>Test Name</label>

        <input type="text"
               th:field="*{testName}"
               placeholder="Example: Complete Blood Count"
               required>


        <!-- Category -->
        <label>Category</label>

        <input type="text"
               th:field="*{category}"
               placeholder="Example: Hematology">


        <!-- Sample Type -->
        <label>Sample Type</label>

        <input type="text"
               th:field="*{sampleType}"
               placeholder="Example: Blood">


        <!-- Price -->
        <label>Price</label>

        <input type="number"
               step="0.01"
               th:field="*{price}"
               placeholder="Example: 500"
               required>


        <!-- Normal Range -->
        <label>Normal Range</label>

        <input type="text"
               th:field="*{normalRange}"
               placeholder="Example: 4.5 - 11.0">


        <!-- Unit -->
        <label>Unit</label>

        <input type="text"
               th:field="*{unit}"
               placeholder="Example: mg/dL">


        <!-- Status -->
        <label>Status</label>

        <select th:field="*{status}">

            <option value="ACTIVE">
                ACTIVE
            </option>

            <option value="INACTIVE">
                INACTIVE
            </option>

        </select>


        <div class="buttons">

            <button type="submit">
                Save Test
            </button>

            <a href="/lab/tests" class="back">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>

</html>
