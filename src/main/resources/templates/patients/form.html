<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Patient Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select, textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
        }

        .full {
            grid-column: span 2;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 4px;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #125ca1;
        }

        .back {
            margin-left: 10px;
            text-decoration: none;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Patient Registration</h1>

    <form th:action="${patient.patientId == null}
                     ? @{/patients/save}
                     : @{/patients/{id}/update(id=${patient.patientId})}"
          th:object="${patient}"
          method="post">

        <div class="form-grid">

            <!-- First Name -->
            <div class="form-group">
                <label>First Name</label>

                <input type="text"
                       th:field="*{firstName}"
                       placeholder="Enter first name">

                <span class="error"
                      th:if="${#fields.hasErrors('firstName')}"
                      th:errors="*{firstName}">
                </span>
            </div>

            <!-- Last Name -->
            <div class="form-group">
                <label>Last Name</label>

                <input type="text"
                       th:field="*{lastName}"
                       placeholder="Enter last name">

                <span class="error"
                      th:if="${#fields.hasErrors('lastName')}"
                      th:errors="*{lastName}">
                </span>
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label>Gender</label>

                <select th:field="*{gender}">
                    <option value="">Select Gender</option>
                    <option value="MALE">Male</option>
                    <option value="FEMALE">Female</option>
                    <option value="OTHER">Other</option>
                </select>

                <span class="error"
                      th:if="${#fields.hasErrors('gender')}"
                      th:errors="*{gender}">
                </span>
            </div>

            <!-- Date of Birth -->
            <div class="form-group">
                <label>Date of Birth</label>

                <input type="date"
                       th:field="*{dateOfBirth}">

                <span class="error"
                      th:if="${#fields.hasErrors('dateOfBirth')}"
                      th:errors="*{dateOfBirth}">
                </span>
            </div>

            <!-- Mobile -->
            <div class="form-group">
                <label>Mobile Number</label>

                <input type="text"
                       th:field="*{mobile}"
                       maxlength="10"
                       placeholder="10-digit mobile number">

                <span class="error"
                      th:if="${#fields.hasErrors('mobile')}"
                      th:errors="*{mobile}">
                </span>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Email</label>

                <input type="email"
                       th:field="*{email}"
                       placeholder="example@gmail.com">

                <span class="error"
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}">
                </span>
            </div>

            <!-- Blood Group -->
            <div class="form-group">
                <label>Blood Group</label>

                <select th:field="*{bloodGroup}">
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

            <!-- Emergency Contact Name -->
            <div class="form-group">
                <label>Emergency Contact Name</label>

                <input type="text"
                       th:field="*{emergencyContactName}"
                       placeholder="Emergency contact name">
            </div>

            <!-- Emergency Contact Number -->
            <div class="form-group">
                <label>Emergency Contact Number</label>

                <input type="text"
                       th:field="*{emergencyContactNumber}"
                       maxlength="10"
                       placeholder="10-digit number">

                <span class="error"
                      th:if="${#fields.hasErrors('emergencyContactNumber')}"
                      th:errors="*{emergencyContactNumber}">
                </span>
            </div>

            <!-- Address -->
            <div class="form-group full">
                <label>Address</label>

                <textarea th:field="*{address}"
                          rows="3"
                          placeholder="Enter complete address">
                </textarea>
            </div>

        </div>

        <br>

        <button type="submit">
            Save Patient
        </button>

        <a href="/patients" class="back">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
