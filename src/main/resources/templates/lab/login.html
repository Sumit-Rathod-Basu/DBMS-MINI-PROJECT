<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Lab Assistant Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #020617,
                    #0f172a,
                    #1e293b
                );
        }

        .login-card {

            width: 420px;

            padding: 40px;

            border-radius: 18px;

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255,255,255,0.15);

            color: white;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.45);
        }

        .logo {

            text-align: center;

            font-size: 45px;

            margin-bottom: 10px;
        }

        h1 {

            text-align: center;

            margin: 0;

        }

        .subtitle {

            text-align: center;

            color: #94a3b8;

            margin: 10px 0 30px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            color: #e2e8f0;
        }

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border-radius: 9px;

            border: 1px solid #475569;

            background: #0f172a;

            color: white;

            outline: none;
        }

        input:focus {

            border-color: #38bdf8;
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #1d4ed8;
        }

        .error {

            background: #7f1d1d;

            color: #fecaca;

            padding: 11px;

            border-radius: 8px;

            margin-bottom: 18px;

            text-align: center;
        }

        .success {

            background: #14532d;

            color: #bbf7d0;

            padding: 11px;

            border-radius: 8px;

            margin-bottom: 18px;

            text-align: center;
        }

        .register-link {

            text-align: center;

            margin-top: 22px;

            color: #94a3b8;
        }

        .register-link a {

            color: #38bdf8;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        🧪
    </div>

    <h1>
        Lab Assistant Login
    </h1>

    <div class="subtitle">
        Pathology Laboratory Management System
    </div>


    <!-- Error -->

    <div
            class="error"
            th:if="${error}"
            th:text="${error}">
    </div>


    <!-- Registration success -->

    <div
            class="success"
            th:if="${success}"
            th:text="${success}">
    </div>


    <form
            th:action="@{/lab/login}"
            method="post">


        <label>
            Email
        </label>

        <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required>


        <label>
            Password
        </label>

        <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required>


        <button type="submit">
            Login
        </button>

    </form>


    <div class="register-link">

        Don't have an account?

        <a th:href="@{/lab/register}">
            Create Account
        </a>

    </div>

</div>

</body>

</html>
