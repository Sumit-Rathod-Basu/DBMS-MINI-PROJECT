<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Lab Reports</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
        }

        .add-btn {
            background: #1976d2;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1976d2;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f8f8;
        }

        .status {
            padding: 5px 10px;
            border-radius: 15px;
            background: #e8f5e9;
            color: #2e7d32;
        }

        .delete-btn {
            background: #d32f2f;
            color: white;
            padding: 7px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        .empty {
            text-align: center;
            padding: 25px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Lab Reports</h1>

        <a href="/lab/reports/add" class="add-btn">
            + Create Report
        </a>

    </div>


    <table>

        <thead>

        <tr>

            <th>ID</th>

            <th>Report Number</th>

            <th>Order ID</th>

            <th>Report Date</th>

            <th>Verified By</th>

            <th>Status</th>

            <th>Clinical Notes</th>

            <th>Action</th>

        </tr>

        </thead>


        <tbody>

        <tr th:if="${#lists.isEmpty(reports)}">

            <td colspan="8" class="empty">
                No reports found.
            </td>

        </tr>


        <tr th:each="report : ${reports}">

            <td th:text="${report.reportId}">
                1
            </td>

            <td th:text="${report.reportNumber}">
                REP-001
            </td>

            <td th:text="${report.order.orderId}">
                1
            </td>

            <td th:text="${report.reportDate}">
                2026-10-07
            </td>

            <td th:text="${report.verifiedBy}">
                1
            </td>

            <td>

                <span class="status"
                      th:text="${report.status}">
                    DRAFT
                </span>

            </td>

            <td th:text="${report.clinicalNotes}">
                Normal findings
            </td>

            <td>

                <a class="delete-btn"
                   th:href="@{/lab/reports/delete/{id}(id=${report.reportId})}"
                   onclick="return confirm('Are you sure you want to delete this report?');">

                    Delete

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
