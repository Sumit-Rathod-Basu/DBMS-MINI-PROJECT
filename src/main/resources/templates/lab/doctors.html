<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Doctors</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .add-btn {
            display: inline-block;
            padding: 10px 16px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1976d2;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f8f8;
        }

        .delete-btn {
            color: white;
            background: #d32f2f;
            padding: 7px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        .empty {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Doctor Management</h1>

    <a href="/lab/doctors/add" class="add-btn">
        + Add Doctor
    </a>

    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Doctor Name</th>
            <th>Specialization</th>
            <th>Mobile</th>
            <th>Email</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>

        <tr th:if="${#lists.isEmpty(doctors)}">
            <td colspan="7" class="empty">
                No doctors found.
            </td>
        </tr>

        <tr th:each="doctor : ${doctors}">

            <td th:text="${doctor.doctorId}"></td>

            <td th:text="${doctor.doctorName}"></td>

            <td th:text="${doctor.specialization}"></td>

            <td th:text="${doctor.mobile}"></td>

            <td th:text="${doctor.email}"></td>

            <td th:text="${doctor.status}"></td>

            <td>
                <a class="delete-btn"
                   th:href="@{/lab/doctors/delete/{id}(id=${doctor.doctorId})}"
                   onclick="return confirm('Are you sure you want to delete this doctor?');">
                    Delete
                </a>
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
