<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Lab Samples</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
        }

        .add-btn {
            background: #1976d2;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 5px;
        }

        .add-btn:hover {
            background: #125ca5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1976d2;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f8f8;
        }

        .status {
            padding: 5px 10px;
            border-radius: 15px;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 13px;
        }

        .delete-btn {
            background: #d32f2f;
            color: white;
            padding: 7px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background: #a52222;
        }

        .empty {
            text-align: center;
            padding: 25px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Sample Management</h1>

        <a href="/lab/samples/add" class="add-btn">
            + Add Sample
        </a>

    </div>


    <table>

        <thead>

        <tr>

            <th>ID</th>

            <th>Sample Code</th>

            <th>Order Number</th>

            <th>Sample Type</th>

            <th>Collection Time</th>

            <th>Received Time</th>

            <th>Status</th>

            <th>Action</th>

        </tr>

        </thead>


        <tbody>

        <tr th:if="${#lists.isEmpty(samples)}">

            <td colspan="8" class="empty">
                No samples found.
            </td>

        </tr>


        <tr th:each="sample : ${samples}">

            <td th:text="${sample.sampleId}">
                1
            </td>

            <td th:text="${sample.sampleCode}">
                SMP-001
            </td>

            <td th:text="${sample.order.orderNumber}">
                ORD-001
            </td>

            <td th:text="${sample.sampleType}">
                Blood
            </td>

            <td th:text="${sample.collectionTime}">
                2026-10-07 10:00
            </td>

            <td th:text="${sample.receivedTime}">
                2026-10-07 10:30
            </td>

            <td>

                <span class="status"
                      th:text="${sample.status}">
                    COLLECTED
                </span>

            </td>

            <td>

                <a class="delete-btn"
                   th:href="@{/lab/samples/delete/{id}(id=${sample.sampleId})}"
                   onclick="return confirm('Are you sure you want to delete this sample?');">

                    Delete

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
