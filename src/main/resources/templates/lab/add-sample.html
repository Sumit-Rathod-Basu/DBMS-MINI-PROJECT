<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Sample</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px 30px;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        button,
        .back {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #2563eb;
            color: white;
            font-weight: bold;
        }

        .back {
            background: #e5e7eb;
            color: #111827;
        }

        @media(max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

        }

    </style>

</head>

<body>

<div class="header">

    <h1>🧪 Add New Sample</h1>

</div>


<div class="container">

    <div class="card">

        <form th:action="@{/lab/samples/save}"
              th:object="${sample}"
              method="post">

            <div class="form-grid">

                <!-- Patient Name -->

                <div class="form-group">

                    <label>
                        Patient Name
                    </label>

                    <input type="text"
                           th:field="*{patientName}"
                           placeholder="Enter patient name"
                           required>

                </div>


                <!-- Age -->

                <div class="form-group">

                    <label>
                        Age
                    </label>

                    <input type="text"
                           th:field="*{age}"
                           placeholder="Enter age"
                           required>

                </div>


                <!-- Test -->

                <div class="form-group">

                    <label>
                        Test Name
                    </label>

                    <input type="text"
                           th:field="*{testName}"
                           placeholder="Example: CBC, LFT, KFT"
                           required>

                </div>


                <!-- Sample Type -->

                <div class="form-group">

                    <label>
                        Sample Type
                    </label>

                    <select th:field="*{sampleType}"
                            required>

                        <option value="">
                            Select Sample Type
                        </option>

                        <option value="Blood">
                            Blood
                        </option>

                        <option value="Urine">
                            Urine
                        </option>

                        <option value="Stool">
                            Stool
                        </option>

                        <option value="Serum">
                            Serum
                        </option>

                        <option value="Plasma">
                            Plasma
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Date -->

                <div class="form-group">

                    <label>
                        Collection Date
                    </label>

                    <input type="date"
                           th:field="*{collectionDate}">

                </div>


                <!-- Time -->

                <div class="form-group">

                    <label>
                        Collection Time
                    </label>

                    <input type="time"
                           th:field="*{collectionTime}">

                </div>


                <!-- Collected By -->

                <div class="form-group full">

                    <label>
                        Collected By
                    </label>

                    <input type="text"
                           th:field="*{collectedBy}"
                           placeholder="Enter staff name">

                </div>


                <!-- Status -->

                <div class="form-group">

                    <label>
                        Status
                    </label>

                    <select th:field="*{status}">

                        <option value="COLLECTED">
                            Collected
                        </option>

                        <option value="RECEIVED">
                            Received
                        </option>

                        <option value="PROCESSING">
                            Processing
                        </option>

                        <option value="COMPLETED">
                            Completed
                        </option>

                        <option value="REJECTED">
                            Rejected
                        </option>

                        <option value="CANCELLED">
                            Cancelled
                        </option>

                    </select>

                </div>

            </div>


            <div class="buttons">

                <button type="submit">
                    Save Sample
                </button>

                <a href="/lab/samples"
                   class="back">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
