<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Add Test - RR Diagnostics</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
        }

        .form-card {
            max-width: 750px;
            margin: 40px auto;
            border: none;
            border-radius: 16px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card form-card shadow-sm">

        <div class="card-body p-4">

            <h3 class="mb-1">
                Add Pathology Test
            </h3>

            <p class="text-muted mb-4">
                Add a new test to Test Master
            </p>

            <form th:action="@{/lab/tests/save}"
                  th:object="${test}"
                  method="post">

                <div class="mb-3">

                    <label class="form-label">
                        Test Code
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{testCode}"
                           placeholder="Example: HB"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Test Name
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{testName}"
                           placeholder="Example: Hemoglobin"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Category
                    </label>

                    <select class="form-select"
                            th:field="*{category}">

                        <option value="">
                            Select Category
                        </option>

                        <option value="Hematology">
                            Hematology
                        </option>

                        <option value="Biochemistry">
                            Biochemistry
                        </option>

                        <option value="Lipid Profile">
                            Lipid Profile
                        </option>

                        <option value="Liver Function">
                            Liver Function
                        </option>

                        <option value="Kidney Function">
                            Kidney Function
                        </option>

                        <option value="Thyroid">
                            Thyroid
                        </option>

                        <option value="Urine">
                            Urine
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Unit
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{unit}"
                           placeholder="Example: g/dL">

                </div>


                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary">

                        Save Test

                    </button>

                    <a href="/lab/tests"
                       class="btn btn-outline-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
