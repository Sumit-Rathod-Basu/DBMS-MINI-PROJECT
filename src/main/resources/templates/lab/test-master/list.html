<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Test Master - RR Diagnostics</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
        }

        .sidebar {
            min-height: 100vh;
            background: #111827;
        }

        .sidebar a {
            color: #d1d5db;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
        }

        .sidebar a:hover {
            background: #1f2937;
            color: white;
        }

        .brand {
            color: white;
            font-size: 22px;
            font-weight: 700;
            padding: 20px;
        }

        .content {
            padding: 30px;
        }

        .card {
            border: none;
            border-radius: 14px;
        }
    </style>
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar p-0">

            <div class="brand">
                RR Diagnostics
            </div>

            <a href="/lab/dashboard">
                🏠 Dashboard
            </a>

            <a href="/lab/tests">
                🧪 Test Master
            </a>

            <a href="/lab/reference-ranges">
                📊 Reference Ranges
            </a>

            <a href="/lab/reports">
                📄 Reports
            </a>

            <a href="/lab/alerts">
                🚨 Alerts
            </a>

        </div>

        <!-- CONTENT -->
        <div class="col-md-10 content">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h2>Test Master</h2>
                    <p class="text-muted">
                        Manage pathology laboratory tests
                    </p>
                </div>

                <a href="/lab/tests/new"
                   class="btn btn-primary">
                    + Add New Test
                </a>

            </div>

            <div class="card shadow-sm">

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead class="table-light">

                            <tr>
                                <th>ID</th>
                                <th>Code</th>
                                <th>Test Name</th>
                                <th>Category</th>
                                <th>Unit</th>
                                <th>Action</th>
                            </tr>

                            </thead>

                            <tbody>

                            <tr th:each="test : ${tests}">

                                <td th:text="${test.id}">
                                    1
                                </td>

                                <td>
                                    <span class="badge bg-secondary"
                                          th:text="${test.testCode}">
                                        HB
                                    </span>
                                </td>

                                <td th:text="${test.testName}">
                                    Hemoglobin
                                </td>

                                <td th:text="${test.category}">
                                    Hematology
                                </td>

                                <td th:text="${test.unit}">
                                    g/dL
                                </td>

                                <td>

                                    <a th:href="@{/lab/tests/edit/{id}(id=${test.id})}"
                                       class="btn btn-sm btn-outline-primary">
                                        Edit
                                    </a>

                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(tests)}">

                                <td colspan="6"
                                    class="text-center text-muted py-4">

                                    No tests found.

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
